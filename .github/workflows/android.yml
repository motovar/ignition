name: Android APK

# Builds only the Android APK, on every push and by hand (Actions ->
# Android APK -> Run workflow). The APK is kept as the workflow artifact
# android-apk. Signed with a throwaway debug key unless the
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS and ANDROID_KEY_ALIAS
# secrets are set.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip python3

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION="v$(cat VERSION)-dev.${GITHUB_SHA::7}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" make android VERSION="$VERSION"
          cp build-android/ignition.apk "ignition-android-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ignition-android-*.apk
